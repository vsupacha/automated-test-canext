<rect width="1100" height="260" rx="16" fill="#f5f8fb"/>
<g fill="#e5eff7" stroke="#236390" stroke-width="2"><rect x="35" y="48" width="260" height="160" rx="10"/><rect x="700" y="48" width="365" height="160" rx="10"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#17364d"><text x="165" y="89" font-size="28">myRIO</text><text x="165" y="125" font-size="22">Stimulus + measurement</text><text x="165" y="162" font-size="20">MXP-A: AO / AI / DIO</text><text x="883" y="89" font-size="28">NUCLEO-C562RE</text><text x="883" y="125" font-size="22">2-zone teaching firmware</text><text x="883" y="162" font-size="20">A0-A1 → PWM0-PWM1</text></g>
