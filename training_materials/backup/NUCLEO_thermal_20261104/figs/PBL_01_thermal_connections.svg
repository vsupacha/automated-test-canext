<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Two-zone myRIO and NUCLEO test bench</title><desc id="desc">AO0 and AO1 stimulate A0 and A1. AI0 and AI1 monitor applied voltage. AI2 reads D13 PA5 LED status. DIO0 and DIO1 measure PWM0 and PWM1. USB remains connected, and the boards share ground.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#236390"/></marker></defs><rect width="1100" height="310" rx="16" fill="#f5f8fb"/>
<g fill="#e5eff7" stroke="#236390" stroke-width="2"><rect x="25" y="45" width="255" height="215" rx="10"/><rect x="805" y="45" width="270" height="215" rx="10"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#17364d"><text x="152" y="77" font-size="27" font-weight="bold">myRIO · MXP-A</text><text x="940" y="77" font-size="26" font-weight="bold">NUCLEO-C562RE</text><text x="152" y="123" font-size="22">AO0 / AO1</text><text x="152" y="166" font-size="22">AI0 / AI1</text><text x="152" y="210" font-size="22">AI2</text><text x="152" y="250" font-size="22">DIO0 / DIO1</text><text x="940" y="123" font-size="22">A0 / A1</text><text x="940" y="210" font-size="22">D13 / PA5 · LED pin</text><text x="940" y="250" font-size="22">PWM0 / PWM1</text></g>
<g fill="none" stroke="#236390" stroke-width="2.5" marker-end="url(#a)"><path d="M280 116 H795"/><path d="M575 116 V160 H290"/><path d="M805 204 H290"/><path d="M805 244 H290"/><path d="M940 25 V37"/></g><circle cx="575" cy="116" r="4.5" fill="#236390"/><path d="M152 260 V282 H940 V260" fill="none" stroke="#17364d" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#236390" font-size="20"><text x="540" y="103">Sensor stimulus: 0.5-2.5 V</text><text x="430" y="147">Applied-voltage feedback</text><text x="540" y="191">Operating status: LED HIGH / LOW</text><text x="540" y="231">PWM frequency + duty</text><text x="940" y="20" font-size="18">USB power stays connected</text><text x="545" y="304" fill="#17364d">Common ground: myRIO AGND / DGND ↔ DUT GND</text></g></svg>