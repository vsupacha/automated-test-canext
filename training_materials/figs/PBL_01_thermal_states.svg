<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="305" viewBox="0 0 1100 305" role="img" aria-labelledby="title desc"><title id="title">Setup Main Cleanup with four UUT test substates</title><desc id="desc">Setup initializes hardware and sets both AO outputs to0.5V. Main runs POWER-ON, A0_PATTERN, A1_PATTERN and AX_CROSSCHECK. Cleanup sets both outputs to0V, checks LED OFF and closes hardware. All stop or error paths reach Cleanup.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#236390"/></marker></defs><rect width="1100" height="305" rx="16" fill="#f5f8fb"/>
<g fill="#e5eff7" stroke="#236390" stroke-width="2"><rect x="25" y="75" width="245" height="145" rx="10"/><rect x="360" y="20" width="380" height="235" rx="10"/><rect x="830" y="75" width="245" height="145" rx="10"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#17364d"><text x="147" y="110" font-size="28" font-weight="bold">Setup</text><text x="147" y="143" font-size="22">HW init</text><text x="147" y="174" font-size="22">AO0 / AO1 = 0.5 V</text><text x="147" y="202" font-size="21">Start → LED ON</text><text x="550" y="55" font-size="28" font-weight="bold">Main</text><text x="550" y="94" font-size="23">POWER-ON</text><text x="550" y="138" font-size="23">A0_PATTERN</text><text x="550" y="182" font-size="23">A1_PATTERN</text><text x="550" y="226" font-size="23">AX_CROSSCHECK</text><text x="952" y="110" font-size="28" font-weight="bold">Cleanup</text><text x="952" y="143" font-size="22">AO0 / AO1 = 0 V</text><text x="952" y="174" font-size="21">Stop → LED OFF</text><text x="952" y="202" font-size="21">Close HW</text></g>
<g fill="none" stroke="#236390" stroke-width="2.5" marker-end="url(#a)"><path d="M270 145 H350"/><path d="M740 145 H820"/><path d="M550 102 V114"/><path d="M550 146 V158"/><path d="M550 190 V202"/><path d="M147 220 V278 H952 V230"/></g><text x="550" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#236390">Stop / Error → Cleanup</text></svg>