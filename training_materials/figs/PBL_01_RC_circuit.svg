<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
<title id="title">RC low-pass filter measured by myRIO</title>
<desc id="desc">Analog output drives a 3.3 kiloohm resistor. AI0 measures Vin before the resistor, AI1 measures Vout after it. A 1 microfarad capacitor connects Vout to the shared analog ground.</desc>
<rect width="1100" height="310" rx="16" fill="#f5f8fb"/>
<g font-family="Arial,sans-serif" fill="#15354d" font-size="25" text-anchor="middle">
<rect x="28" y="88" width="165" height="75" rx="10" fill="#deebf5" stroke="#236390" stroke-width="2"/>
<text x="110" y="135">myRIO AO</text>
<text x="300" y="38" fill="#236390">AI0: Vin</text>
<text x="720" y="38" fill="#236390">AI1: Vout</text>
<text x="500" y="86">R = 3.3 kΩ</text>
<text x="885" y="195">C = 1 µF</text>
<text x="510" y="285" font-size="22">Common AGND for AO, AI0 and AI1</text>
</g>
<g fill="none" stroke="#15354d" stroke-width="4" stroke-linejoin="round">
<path d="M193 125 H425 M575 125 H720 V180 M300 125 V55 M720 125 V55"/>
<rect x="425" y="108" width="150" height="34" fill="#fff"/>
<path d="M680 180 H760 M680 195 H760 M720 195 V235 H110 V163"/>
<path d="M510 235 V245 M486 245 H534 M493 254 H527 M501 263 H519"/>
</g>
<g fill="#236390"><circle cx="300" cy="125" r="6"/><circle cx="720" cy="125" r="6"/></g>
</svg>
