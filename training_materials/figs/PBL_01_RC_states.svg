<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">State machine for measuring an RC frequency response</title>
<desc id="desc">Initialize, Set frequency, Settle, Acquire, Calculate, Next frequency. More points return to Set frequency; a finished sweep goes to Report and Cleanup. Stop or error also goes to Cleanup.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#236390"/></marker></defs>
<rect width="1100" height="340" rx="16" fill="#f5f8fb"/>
<g fill="#e5eff7" stroke="#236390" stroke-width="2">
<rect x="25" y="40" width="195" height="62" rx="10"/>
<rect x="300" y="40" width="220" height="62" rx="10"/>
<rect x="590" y="40" width="195" height="62" rx="10"/>
<rect x="870" y="40" width="195" height="62" rx="10"/>
<rect x="870" y="170" width="195" height="62" rx="10"/>
<rect x="590" y="170" width="220" height="62" rx="10"/>
<rect x="300" y="170" width="220" height="62" rx="10"/>
<rect x="25" y="170" width="195" height="62" rx="10" fill="#f7ebdc"/>
</g>
<g font-family="Arial,sans-serif" fill="#15354d" font-size="24" text-anchor="middle">
<text x="122" y="79">Initialize</text><text x="410" y="79">Set frequency</text>
<text x="688" y="79">Settle</text><text x="968" y="79">Acquire</text>
<text x="968" y="209">Calculate</text><text x="700" y="209">Next frequency</text>
<text x="410" y="209">Report</text><text x="122" y="209">Cleanup</text>
<text x="555" y="136" font-size="19">More points</text>
<text x="553" y="187" font-size="19">Done</text>
<text x="515" y="303" font-size="22">Stop or error from any active state → Cleanup</text>
</g>
<g fill="none" stroke="#236390" stroke-width="3" marker-end="url(#arrow)">
<path d="M220 71 H295"/><path d="M520 71 H585"/><path d="M785 71 H865"/>
<path d="M968 102 V165"/><path d="M870 201 H815"/>
<path d="M590 201 H525"/><path d="M300 201 H225"/>
<path d="M700 170 V147 H410 V107"/>
</g>
</svg>
